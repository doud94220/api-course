api_platform:
    title: Hello API Platform
    version: 1.0.0
    formats:
        jsonld: ['application/ld+json']
        json: ['application/json'] # Rajouté par moi
    docs_formats:
        jsonld: ['application/ld+json']
        jsonopenapi: ['application/vnd.openapi+json']
        html: ['text/html']
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
        extra_properties:
            standard_put: true
            rfc_7807_compliant_errors: true
        pagination_items_per_page: 10 # Bizarrement, on met ça dans defaults, et non dans collection
        pagination_client_enabled: true
        pagination_client_items_per_page: true
    event_listeners_backward_compatibility_layer: false
    keep_legacy_inflector: false
    collection:
        pagination:
            enabled: false # Attention, dans la doc d'APIP, c'est "pagination_enabled: true"
            items_per_page_parameter_name: 'count' # On repasse dans des paramètres hors de default